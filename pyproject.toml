[project]
name = "netbox-oidc-group-sync"
dynamic = ["version"]
description = "A python-social-auth pipeline step that syncs NetBox Django groups and superuser status from an OIDC 'groups' claim"
readme = "README.md"
license = "MIT"
authors = [{ name = "Derek Ditch", email = "dcode@users.noreply.github.com" }]
keywords = ["netbox", "oidc", "sso", "social-auth", "django", "authentik"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["django>=4.2", "social-auth-core>=4.5"]

[project.urls]
Homepage = "https://github.com/dcode/netbox-oidc-group-sync"
Documentation = "https://dcode.github.io/netbox-oidc-group-sync/"
Issues = "https://github.com/dcode/netbox-oidc-group-sync/issues"
Source = "https://github.com/dcode/netbox-oidc-group-sync"
Changelog = "https://github.com/dcode/netbox-oidc-group-sync/releases"

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/netbox_oidc_group_sync/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_oidc_group_sync"]

# ---------------------------------------------------------------------------
# Hatch environments
# ---------------------------------------------------------------------------

[tool.hatch.envs.default]
installer = "uv"
features = ["dev"]

[tool.hatch.envs.hatch-test]
installer = "uv"
features = ["dev"]

[tool.hatch.envs.hatch-static-analysis]
config-path = "none"

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
cov = "pytest --cov=src --cov-report=term-missing --cov-fail-under=100 {args:tests}"
lint = ["ruff check .", "ruff format --check .", "mypy src"]
fmt = ["ruff check --fix .", "ruff format ."]
typecheck = "mypy src"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
pythonpath = ["."]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line-length -- handled by formatter
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__ (documented on class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # no docstring requirements in tests

[tool.ruff.lint.isort]
known-first-party = ["netbox_oidc_group_sync"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.rumdl]
line-length = 120
exclude = [".venv"]
