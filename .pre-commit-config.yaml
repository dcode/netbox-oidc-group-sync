repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: rumdl
        name: rumdl
        entry: rumdl check
        language: system
        types: [markdown]

      - id: pytest-cov
        name: pytest (100% coverage)
        entry: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=100 tests
        language: system
        pass_filenames: false
        types: [python]
